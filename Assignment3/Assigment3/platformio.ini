; Arduino Uno R3 firmware.
;   firmata  (default) StandardFirmata, used by the Python code via pyFirmata2
;   selftest           board self-test, see src/selftest/main.cpp
;
; Flash:  pio run -e firmata -t upload
;         pio run -e selftest -t upload

[platformio]
default_envs = firmata

[env]
platform = atmelavr
board = uno
framework = arduino

[env:firmata]
build_src_filter = +<firmata/>
lib_deps =
    firmata/Firmata@^2.5.9
    arduino-libraries/Servo@^1.2.2

[env:selftest]
build_src_filter = +<selftest/>
monitor_speed = 115200
